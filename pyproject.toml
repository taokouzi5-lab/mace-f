[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mace-f"
version = "1.0.0"
description = "Manufacturing AI Carbon Emission Framework (MACE-F) — carbon benchmarking for manufacturing AI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "codecarbon>=2.7.1",
    "numpy>=1.24.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "Pillow>=10.3.0",
    "xgboost>=1.7.0",
]

[project.optional-dependencies]
dl = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "diffusers>=0.24.0",
    "transformers>=4.36.0",
]
api = [
    "openai>=1.6.0",
]
viz = [
    "matplotlib>=3.7",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov",
    "ruff",
    "bandit",
]

[tool.setuptools.packages.find]
include = ["carbon_benchmark*"]
exclude = ["tests*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Core correctness rules only: pycodestyle errors + pyflakes (F401/F841/...).
# Style modernization (UP) is intentionally not enforced on this research codebase.
select = ["E4", "E7", "E9", "F"]
